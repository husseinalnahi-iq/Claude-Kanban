<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Kanban</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The font picker's downloadable faces (Inter, Roboto, IBM Plex Sans) and the two code faces; SF Pro and
      Segoe UI come from the computer. A browser only downloads a face once text is drawn in it.
    -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <!--
      Theme and font before first paint. The app sets the same attribute once React mounts; doing it here too is
      what stops a light machine seeing a black flash while the bundle loads.
    -->
    <script>
      (function () {
        var t = "system";
        var f = "apple";
        try {
          var v = JSON.parse(localStorage.getItem("kanban.view") || "null");
          if (v && (v.theme === "light" || v.theme === "dark" || v.theme === "navy" || v.theme === "system")) t = v.theme;
          if (v && /^(apple|inter|segoe|roboto|plex)$/.test(v.font)) f = v.font;
        } catch (e) {}
        document.documentElement.dataset.font = f;
        document.documentElement.dataset.theme =
          t === "system" ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
